runtime: python311

entrypoint: gunicorn -b :$PORT main:app

env_variables:
  DATABASE_URL: "${DATABASE_URL}"
  GMAIL_OAUTH_CLIENT_ID: "${GMAIL_OAUTH_CLIENT_ID}"
  GMAIL_OAUTH_CLIENT_SECRET: "${GMAIL_OAUTH_CLIENT_SECRET}"
  GMAIL_OAUTH_REFRESH_TOKEN: "${GMAIL_OAUTH_REFRESH_TOKEN}"
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
  TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
  PUBSUB_TOPIC_NAME: "${PUBSUB_TOPIC_NAME}"
  PUBSUB_PUSH_AUDIENCE: "${PUBSUB_PUSH_AUDIENCE}"
  NOTIFICATION_RETRY_AFTER_SECONDS: "${NOTIFICATION_RETRY_AFTER_SECONDS}"
  WATCH_RENEWAL_SAFETY_WINDOW_SECONDS: "${WATCH_RENEWAL_SAFETY_WINDOW_SECONDS}"
  LOG_LEVEL: "${LOG_LEVEL}"
